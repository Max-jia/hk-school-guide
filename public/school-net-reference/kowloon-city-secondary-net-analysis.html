84049684, "boysPer100": 293.69761655375106, "girlsPer100": 301.7837668404968}]}}, "backtests": [{"year": 2024, "mape": 2.7226617341467376, "maxAPE": 9.968816954432459, "thisNet": {"dc": "G", "actual": 4838, "estimate": 4841.024195811193, "errorPercent": 0.06250921478281324}}, {"year": 2025, "mape": 1.310567897835915, "maxAPE": 3.972910651287398, "thisNet": {"dc": "G", "actual": 4719, "estimate": 4733.618136972203, "errorPercent": 0.30977192142831456}}]}, payload={"sc": "<h1>九龙城KL3男女竞争指数：按家庭选择试算</h1><p class=\"notice\"><strong>2026条件需求＋2026/27历史公开位，不是2027预测。</strong>未知的净需求和共享位分配默认留空；50%没有较可能的依据。</p><p>2025/26小六男2,637、女2,495，2025本网实际参派4,719。按两届小六变化及全港48,545校准，2026估计约4,839人。男女潜在目标比例默认各三分之一，仅作演示。</p><section class=\"panel\"><h2>选择愿意考虑的学校范围</h2><label>可复核的清单<select id=\"secondary-sample\"><option value=\"main\">原主参考样本：13校673公开位</option><option value=\"common\">两份分类共同参考样本：10校469公开位</option><option value=\"alternative\">另一份分类替代学校清单：11校542公开位</option></select></label><p id=\"sample-summary\" class=\"notice\"></p><div class=\"fields\"><label>男生潜在目标比例（%），默认仅演示<input id=\"band-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>女生潜在目标比例（%），默认仅演示<input id=\"band-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潜在男生中仍争本组公开位的净比例，未知留空（%）<input id=\"r-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潜在女生中仍争本组公开位的净比例，未知留空（%）<input id=\"r-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label></div><label>共享位假设分给男生的比例，女生取余数（%）<input id=\"secondary-share\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><button id=\"proxy-share\">用小六结构作假设：男51.4%、女48.6%</button><p>按钮按原人数比完整精度计算；输入框显示一位小数。共享位只分一次，没有官方性别配额。</p><div id=\"secondary-result\" class=\"result\" aria-live=\"polite\"></div></section><p>指数低于1不保证获派，更不能推算首选机会；逐校志愿与随机编号未知。扩大学校范围，现实目标人数也可能改变。</p><p><a href=\"#article\">返回正文</a> · <a href=\"#method\">看人数依据和公式</a> · <a href=\"计算与口径.json\">原值与回测</a> · <a href=\"https://www.skhykh.edu.hk/CustomPage/12/school_list_KLNC_2026.pdf\">官方历史名册</a></p>", "tc": "<h1>九龍城KL3男女競爭指數：按家庭選擇試算</h1><p class=\"notice\"><strong>2026條件需求＋2026/27歷史公開位，不是2027預測。</strong>未知的淨需求和共享位分配默認留空；50%沒有較可能的依據。</p><p>2025/26小六男2,637、女2,495，2025本網實際參派4,719。按兩屆小六變化及全港48,545校準，2026估計約4,839人。男女潛在目標比例默認各三分之一，僅作演示。</p><section class=\"panel\"><h2>選擇願意考慮的學校範圍</h2><label>可複核的清單<select id=\"secondary-sample\"><option value=\"main\">原主參考樣本：13校673公開位</option><option value=\"common\">兩份分類共同參考樣本：10校469公開位</option><option value=\"alternative\">另一份分類替代學校清單：11校542公開位</option></select></label><p id=\"sample-summary\" class=\"notice\"></p><div class=\"fields\"><label>男生潛在目標比例（%），默認僅演示<input id=\"band-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>女生潛在目標比例（%），默認僅演示<input id=\"band-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潛在男生中仍爭本組公開位的淨比例，未知留空（%）<input id=\"r-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潛在女生中仍爭本組公開位的淨比例，未知留空（%）<input id=\"r-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label></div><label>共享位假設分給男生的比例，女生取餘數（%）<input id=\"secondary-share\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><button id=\"proxy-share\">用小六結構作假設：男51.4%、女48.6%</button><p>按鈕按原人數比完整精度計算；輸入框顯示一位小數。共享位只分一次，沒有官方性別配額。</p><div id=\"secondary-result\" class=\"result\" aria-live=\"polite\"></div></section><p>指數低於1不保證獲派，更不能推算首選機會；逐校志願與隨機編號未知。擴大學校範圍，現實目標人數也可能改變。</p><p><a href=\"#article\">返回正文</a> · <a href=\"#method\">看人數依據和公式</a> · <a href=\"计算与口径.json\">原值與回測</a> · <a href=\"https://www.skhykh.edu.hk/CustomPage/12/school_list_KLNC_2026.pdf\">官方歷史名冊</a></p>"}, chars={"本": "本", "组": "組", "校": "校", "男": "男", "女": "女", "共": "共", "享": "享", "个": "個", "公": "公", "开": "開", "位": "位", "另": "另", "保": "保", "留": "留", "排": "排", "除": "除", "未": "未", "知": "知", "条": "條", "件": "件", "请": "請", "空": "空", "暂": "暫", "不": "不", "报": "報", "竞": "競", "争": "爭", "指": "指", "数": "數", "潜": "潛", "在": "在", "目": "目", "标": "標", "净": "淨", "需": "需", "求": "求"
