abel><label>女生潜在目标比例（%），默认仅演示<input id=\"band-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潜在男生中仍争本组公开位的净比例，未知留空（%）<input id=\"r-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潜在女生中仍争本组公开位的净比例，未知留空（%）<input id=\"r-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label></div><label>共享位假设分给男生的比例，女生取余数（%）<input id=\"secondary-share\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><button id=\"proxy-share\">用小六结构作假设：男53.5%、女46.5%</button><p>按钮按原人数比完整精度计算；输入框显示一位小数。共享位只分一次，没有官方性别配额。</p><div id=\"secondary-result\" class=\"result\" aria-live=\"polite\"></div></section><p>指数低于1不保证获派，更不能推算首选机会；逐校志愿与随机编号未知。扩大学校范围，现实目标人数也可能改变。</p><p><a href=\"#article\">返回正文</a> · <a href=\"#method\">看人数依据和公式</a> · <a href=\"计算与口径.json\">原值与回测</a> · <a href=\"https://www.ktgps-smr.edu.hk/sites/default/files/download/2426_%E6%B7%B1%E6%B0%B4%E5%9F%97%E5%8D%80.pdf\">官方历史名册</a></p>", "tc": "<h1>深水埗KL2男女競爭指數：按家庭選擇試算</h1><p class=\"notice\"><strong>2026條件需求＋2026/27歷史公開位，不是2027預測。</strong>未知的淨需求和共享位分配默認留空；50%沒有較可能的依據。</p><p>2025/26小六男1,915、女1,662，2025本網實際參派2,997。按兩屆小六變化及全港48,545校準，2026估計約3,079人。男女潛在目標比例默認各三分之一，僅作演示。</p><section class=\"panel\"><h2>選擇願意考慮的學校範圍</h2><label>可複核的清單<select id=\"secondary-sample\"><option value=\"main\">原主參考樣本：7校441公開位</option><option value=\"common\">兩份分類共同參考樣本：4校307公開位</option></select></label><p id=\"sample-summary\" class=\"notice\"></p><div class=\"fields\"><label>男生潛在目標比例（%），默認僅演示<input id=\"band-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>女生潛在目標比例（%），默認僅演示<input id=\"band-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潛在男生中仍爭本組公開位的淨比例，未知留空（%）<input id=\"r-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潛在女生中仍爭本組公開位的淨比例，未知留空（%）<input id=\"r-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label></div><label>共享位假設分給男生的比例，女生取餘數（%）<input id=\"secondary-share\" type=\"number\" min=\"0\" max=\"100\" ste
