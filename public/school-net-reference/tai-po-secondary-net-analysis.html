r100": 187.06337821598882}]}, "common": {"codes": ["434", "443", "446"], "label": "两份分类共同参考样本", "boysExclusive": 0, "girlsExclusive": 0, "shared": 216, "open": 216, "reservedExcluded": 0, "boysModelSupply": 116.96069868995635, "girlsModelSupply": 99.03930131004365, "boysBreakEven": 0.3207469071296375, "girlsBreakEven": 0.3207469071296374, "scenarios": [{"residual": 0.25, "boysIndex": 0.7794307425666199, "girlsIndex": 0.77943074256662, "boysPer100": 77.94307425666199, "girlsPer100": 77.943074256662}, {"residual": 0.5, "boysIndex": 1.5588614851332399, "girlsIndex": 1.55886148513324, "boysPer100": 155.88614851332397, "girlsPer100": 155.886148513324}, {"residual": 0.75, "boysIndex": 2.33829222769986, "girlsIndex": 2.33829222769986, "boysPer100": 233.829222769986, "girlsPer100": 233.829222769986}, {"residual": 1, "boysIndex": 3.1177229702664797, "girlsIndex": 3.11772297026648, "boysPer100": 311.77229702664795, "girlsPer100": 311.772297026648}]}}, "backtests": [{"year": 2024, "mape": 2.7226617341467376, "maxAPE": 9.968816954432459, "thisNet": {"dc": "P", "actual": 2264, "estimate": 2148.013028755719, "errorPercent": -5.123099436584855}}, {"year": 2025, "mape": 1.310567897835915, "maxAPE": 3.972910651287398, "thisNet": {"dc": "P", "actual": 1989, "estimate": 1971.8657695758468, "errorPercent": -0.8614494934214734}}]}, payload={"sc": "<h1>大埔NT6男女竞争指数：按家庭选择试算</h1><p class=\"notice\"><strong>2026条件需求＋2026/27历史公开位，不是2027预测。</strong>未知的净需求和共享位分配默认留空；50%没有较可能的依据。</p><p>2025/26小六男1,240、女1,050，2025本网实际参派1,989。按两届小六变化及全港48,545校准，2026估计约2,020人。男女潜在目标比例默认各三分之一，仅作演示。</p><section class=\"panel\"><h2>选择愿意考虑的学校范围</h2><label>可复核的清单<select id=\"secondary-sample\"><option value=\"main\">原主参考样本：5校360公开位</option><option value=\"common\">两份分类共同参考样本：3校216公开位</option></select></label><p id=\"sample-summary\" class=\"notice\"></p><div class=\"fields\"><label>男生潜在目标比例（%），默认仅演示<input id=\"band-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>女生潜在目标比例（%），默认仅演示<input id=\"band-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潜在男生中仍争本组公开位的净比例，未知留空（%）<input id=\"r-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潜在女生中仍争本组公开位的净比例，未知留空（%）<input id=\"r-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label></div><label>共享位假设分给男生的比例，女生取余数（%）<input id=\"secondary-share\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><button id=\"proxy-share\">用小六结构作假设：男54.1%、女45.9%</button><p>按钮按原人数比完整精度计算；输入框显示一位小数。共享位只分一次，没有官方性别配额。</p><div id=\"secondary-result\" class=\"result\" aria-live=\"polite\"></div></section><p>指数低于1不保证获派，更不能推算首选机会；逐校志愿与随机编号未知。扩大学校范围，现实目标人数也可能改变。</p><p><a href=\"#article\">返回正文</a> · <a href=\"#method\">看人数依据和公式</a> · <a href=\"计算与口径.json\">原值与回测</a> · <a href=\"https://www.ktgps-smr.edu.hk/sites/default/files/download/2426_%E5%A4%A7%E5%9F%94%E5%8D%80.pdf\">官方历史名册</a></p>", "tc": "<h1>大埔NT6男女競爭指數：按家庭選擇試算</h1><p class=\"notice\"><strong>2026條件需求＋2026/27歷史公開位，不是2027預測。</strong>未知的淨需求和共享位分配默認留空；50%沒有較可能的依據。</p><p>2025/26小六男1,240、女1,050，2025本網實際參派1,989。按兩屆小六變化及全港48,545校準，2026估計約2,020人。男女潛在目標比例默認各三分之一，僅作演示。</p><section class=\"panel\"><h2>選擇願意考慮的學校範圍</h2><label>可複核的清單<select id=\"secondary-sample\"><option value=\"main\">原主參考樣本：5校360公開位</option><option value=\"common\">兩份分類共同參考樣本：3校216公開位</option></select></label><p id=\"sample-summary\" class=\"notice\"></p><div class=\"fields\"><label>男生潛在目標比例（%），默認僅演示<input id=\"band-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>女生潛在目標比例（%），默認僅演示<input id=\"band-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潛在男生中仍爭本組公開位的淨比例，未知留空（%）<input id=\"r-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潛在女生中仍爭本組公開位的淨比例，未知留空（%）<input id=\"r-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label></div><label>共享位假設分給男生的比例，女生取餘數（%）<input id=\"secondary-share\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><button id=\"proxy-share\">用小六結構作假設：男
