const payload={"tool": {"sc": "\u003cp>\u003cstrong>2026历史学额参考（官方历史原件已核）：\u003c/strong>\u003ca href=\"/school-net-reference/primary-2026.html?net=12\">按学校勾选历史供给试算\u003c/a>。2027需求与2026旧供给分年列明；借位另设假设。此页仅本地审阅。\u003c/p>\u003csection class=\"notice\">\u003ch2>小学人数与派位估算\u003c/h2>\u003cp>12网已加入官方人口、往届乙部底数和2027条件规模。性别比例、目标需求及当届乙部学额未知时，试算保留为空。\u003ca href=\"/school-net-reference/primary-population.html?net=12\">打开小学人数与派位试算\u003c/a>；下方是配套升中模型及原有小学清单，两个学段不能混算。\u003c/p>\u003c/section>\u003ch1>官方人数底盘下的条件估算\u003c/h1>\u003cdiv class=\"notice\">\u003cp>\u003cstrong>净留存比例未知时，保留为空。\u003c/strong>本工具不默认男女各300人，也不把50%设为最可能留存率。\u003c/p>\u003cp>2025/26校址区小六男860、女1,089；2025升中网实际参加1,466人，属上一届。两张表统计范围不同。按历史衔接及同届全港总数推算2026网内规模约1,450人，仍非官方分网实数。\u003c/p>\u003cp>潜在目标暂按整体三分之一及小六男女结构推算；第一组实际男女结构未核得。以下均为2026历史条件模型，不能直接称2027实际竞争率。\u003ca href=\"/school-net-reference/secondary-method.html\">查看官方底数、全部假设、回测与局限\u003c/a>。\u003c/p>\u003c/div>\n\u003csection class=\"panel\">\u003ch2>先选学校清单，再填有依据的条件\u003c/h2>\u003clabel>参考学校清单\u003cselect id=\"sample\">\u003coption value=\"main\">本区7所参考样本：219个非保留位\u003c/option>\u003coption value=\"common\">家庭偏好演示：不选真光，169个非保留位\u003c/option>\u003c/select>\u003c/label>\u003cdiv id=\"current-supply\" class=\"notice\">\u003c/div>\n\u003clabel>潜在第一组中男生占比，假设：\u003coutput id=\"band-share-value\">\u003c/output>\u003cinput id=\"band-male-share\" type=\"range\" min=\"0\" max=\"100\" step=\"any\" value=\"44.12519240636223\">\u003c/label>\u003cp>初值近似官方小六男女结构，不代表实际第一组男女拆分。女生占比取余数，总潜在目标池仍按网内规模估计的三分之一。\u003c/p>\n\u003cdiv class=\"fields\">\u003clabel>潜在男生目标中仍争本组公开位的比例，未知可留空（%）\u003cinput id=\"boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\" placeholder=\"没有实数请留空\">\u003c/label>\u003clabel>潜在女生目标中仍争本组公开位的比例，未知可留空（%）\u003cinput id=\"girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\" placeholder=\"没有实数请留空\">\u003c/label>\u003c/div>\n\u003clabel>共享位假设分给男生：\u003coutput id=\"share-value\">\u003c/output>\u003cinput id=\"share\" type=\"range\" min=\"0\" max=\"100\" step=\"any\" value=\"44.12519240636223\">\u003c/label>\u003cp>初值亦取小六男生占比，只作模型分摊；实际派位没有这个预设性别配额。\u003c/p>\u003cdiv id=\"model-result\" class=\"result\" aria-live=\"polite\">\u003c/div>\u003cp>持平比例是条件性临界数，不是已知留存率。自行、非派位录取、保留资格、甲部及学校偏好均可能改变净需求；不按各渠道固定比例重复扣人。学校Banding仍为民间参考。\u003c/p>\u003c/section>\n\u003csection class=\"panel\">\u003ch2>12网：首选之外，愿意读哪些学校\u003c/h2>\u003cp>按2027自行名册14所官津列名。这里只比较学校数量，不包含5所独立招生直私，不计算统派学额占比或成功率。\u003c/p>\n\u003clabel>孩子性别\u003cselect id=\"primary-sex\">\u003coption value=\"男\">男孩\u003c/option>\u003coption value=\"女\">女孩\u003c/option>\u003c/select>\u003c/label>\n\u003cdiv id=\"school-checks\">\u003c/div>\u003cdiv id=\"primary-result\" class=\"result\" aria-live=\"polite\">\u003c/div>\u003c/section>", "tc": "\u003cp>\u003cstrong>2026歷史學額參考（官方歷史原件已核）：\u003c/strong>\u003ca href=\"/school-net-reference/primary-2026.html?net=12\">按學校勾選歷史供給試算\u003c/a>。2027需求與2026舊供給分年列明；借位另設假設。此頁僅本地審閲。\u003c/p>\u003csection class=\"notice\">\u003ch2>小學人數與派位估算\u003c/h2>\u003cp>12網已加入官方人口、往屆乙部底數和2027條件規模。性別比例、目標需求及當屆乙部學額未知時，試算保留為空。\u003ca href=\"/school-net-reference/primary-population.html?net=12\">打開小學人數與派位試算\u003c/a>；下方是配套升中模型及原有小學清單，兩個學段不能混算。\u003c/p>\u003c/section>\u003ch1>官方人數底盤下的條件估算\u003c/h1>\u003cdiv class=\"notice\">\u003cp>\u003cstrong>淨留存比例未知時，保留為空。\u003c/strong>本工具不默認男女各300人，也不把50%設為最可能留存率。\u003c/p>\u003cp>2025/26校址區小六男860、女1,089；2025升中網實際參加1,466人，屬上一屆。兩張表統計範圍不同。按歷史銜接及同屆全港總數推算2026網內規模約1,450人，仍非官方分網實數。\u003c/p>\u003cp>潛在目標暫按整體三分之一及小六男女結構推算；第一組實際男女結構未核得。以下均為2026歷史條件模型，不能直接稱2027實際競爭率。\u003ca href=\"/school-net-reference/secondary-method.html\">查看官方底數、全部假設、回測與侷限\u003c/a>。\u003c/p>\u003c/div>\n\u003csection class=\"panel\">\u003ch2>先選學校清單，再填有依據的條件\u003c/h2>\u003clabel>參考學校清單\u003cselect id=\"sample\">\u003coption value=\"main\">本區7所參考樣本：219個非保留位\u003c/option>\u003coption value=\"common\">家庭偏好演示：不選真光，169個非保留位\u003c/option>\u003c/select>\u003c/label>\u003cdiv id=\"current-supply\" class=\"notice\">\u003c/div>\n\u003clabel>潛在第一組中男生佔比，假設：\u003coutput id=\"band-share-value\">\u  const cfg=populationBase.variants[state.sample]||populationBase.variants.main;
 if(!state.populationReady){state.share=populationBase.boysShare*100;state.bandMale=populationBase.boysShare*100;state.populationReady=true}
