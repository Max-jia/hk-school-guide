 -1.0648791034869154}, {"code": "M", "actual": 4316, "estimate": 4267.700493360155, "errorPercent": -1.1190803206637012}, {"code": "N", "actual": 3097, "estimate": 3220.041042870371, "errorPercent": 3.972910651287398}, {"code": "P", "actual": 1989, "estimate": 1971.8657695758468, "errorPercent": -0.8614494934214734}, {"code": "Q", "actual": 2142, "estimate": 2095.307830131855, "errorPercent": -2.1798398631253435}, {"code": "R", "actual": 4674, "estimate": 4692.8277722454695, "errorPercent": 0.40281926070753205}, {"code": "S", "actual": 3280, "estimate": 3199.9484502765677, "errorPercent": -2.44059602815343}, {"code": "T", "actual": 979, "estimate": 992.5519773992356, "errorPercent": 1.3842673543652317}]}]}, payload={"sc": "<h1>湾仔男女竞争指数：按自己的条件试算</h1><p class=\"notice\"><strong>2026条件需求＋2026/27历史公开位，不是2027预测。</strong>男女净需求和共享位分配没有实数，默认留空；不会自动挑50%当基准。</p><p>2025/26小六男860、女1,089；2025本网实际参派1,466。按两届小六变化及全港48,545校准，2026条件规模约1,450。潜在目标比例各三分之一只是演示，实际性别组别未知。</p><section class=\"panel\"><h2>先选家庭愿意接受的学校范围</h2><label>可复核的学校清单<select id=\"secondary-sample\"><option value=\"local\">本区7校：219公开位</option><option value=\"borrowed\">加两份分类共同6所借位：13校237公开位</option><option value=\"disputed\">再加分类有分歧的筲官：14校239公开位</option><option value=\"withoutTrueLight\">本区不选真光：6校169公开位</option></select></label><p id=\"sample-summary\" class=\"notice\"></p><div class=\"fields\"><label>男生潜在目标比例（%），默认仅演示<input id=\"band-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>女生潜在目标比例（%），默认仅演示<input id=\"band-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潜在男生中仍争本组公开位的净比例，未知留空（%）<input id=\"r-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潜在女生中仍争本组公开位的净比例，未知留空（%）<input id=\"r-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label></div><label>共享位假设分给男生的比例，女生取余数（%）<input id=\"secondary-share\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><button id=\"proxy-share\">用小六结构作分配假设：男44.1%、女55.9%</button><p>按钮按860／1949完整精度计算；显示百分比取整。共享位只分一次，不是官方预留男女配额。</p><div id=\"secondary-result\" class=\"result\" aria-live=\"polite\"></div></section><p>指数1只是该条件下人数与模型位相等。没有逐校志愿和随机编号，不能计算录取率或保证首选。扩大学校范围后，真实目标需求也可能改变，不能只扩大分母、宣称现实变得容易。</p><p><a href=\"#article\">返回文章前部</a> · <a href=\"#method\">查看人数依据</a> · <a href=\"计算与口径.json\">下载原值、公式及回测</a> · <a href=\"sources/article-source-33.pdf\">完整历史名册</a></p>", "tc": "<h1>灣仔男女競爭指數：按自己的條件試算</h1><p class=\"notice\"><strong>2026條件需求＋2026/27歷史公開位，不是2027預測。</strong>男女淨需求和共享位分配沒有實數，默認留空；不會自動挑50%當基準。</p><p>2025/26小六男860、女1,089；2025本網實際參派1,466。按兩屆小六變化及全港48,545校準，2026條件規模約1,450。潛在目標比例各三分之一隻是演示，實際性別組別未知。</p><section class=\"panel\"><h2>先選家庭願意接受的學校範圍</h2><label>可複核的學校清單<select id=\"secondary-sample\"><option value=\"local\">本區7校：219公開位</option><option value=\"borrowed\">加兩份分類共同6所借位：13校237公開位</option><option value=\"disputed\">再加分類有分歧的筲官：14校239公開位</option><option value=\"withoutTrueLight\">本區不選真光：6校169公開位</option></select></label><p id=\"sample-summary\" class=\"notice\"></p><div class=\"fields\"><label>男生潛在目標比例（%），默認僅演示<input id=\"band-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>女生潛在目標比例（%），默認僅演示<input id=\"band-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潛在男生中仍爭本組公開位的淨比例，未知留空（%）<input id=\"r-boys\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><label>潛在女生中仍爭本組公開位的淨比例，未知留空（%）<input id=\"r-girls\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label></div><label>共享位假設分給男生的比例，女生取餘數（%）<input id=\"secondary-share\" type=\"number\" min=\"0\" max=\"100\" step=\"any\"></label><button id=\"proxy-share\">用小六結構作分配假設：男44.1%、女55.9%</button><p>按鈕按860／1949完整精度計算；顯示百分比取整。共享位只分一次，不是官方預留男女配額。</p><div id=\"secondary-result\" class=\"result\" aria-live=\"polite\"></div></section><p>指數1只是該條件下人數與模型位相等。沒有逐校志願和隨機編號，不能計算錄取率或保證首選。擴大學校範圍後，真實目標需求也可能改變，不能只擴大分母、宣稱現實變得容易。</p><p><a href=\"#article\">返回文章前部</a> · <a href=\"#method\">查看人數依據</a> · <a href=\"计算与口径.json\">下載原值、公式及回測</a> · <a href=\"sources/article-source-33.p
